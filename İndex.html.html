<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Oyun Konsolu</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Konsol">
<meta name="theme-color" content="#04081a">
<style>
:root{--bg:#04081a;--bg2:#0b1a46;--ink:#f2f5ff;--dim:#8d9bc7;--line:#ffffff2e}
*{box-sizing:border-box;margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"SF Pro Display",-apple-system,"Segoe UI",Roboto,sans-serif}
#home{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
background:radial-gradient(900px 500px at 75% -10%,#1d3f9a99,transparent 70%),radial-gradient(700px 500px at 0% 110%,#5b1f8f66,transparent 70%),linear-gradient(180deg,var(--bg2),var(--bg))}
.top{display:flex;align-items:center;gap:16px;padding:18px 28px}
.top h1{font-size:20px;font-weight:600;letter-spacing:.3px;flex:1}
.top button,.top span{font-size:17px;color:var(--dim)}
.top button{background:none;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;color:var(--ink)}
#row{display:flex;gap:22px;overflow-x:auto;padding:30px 28px 20px;scroll-snap-type:x proximity;scrollbar-width:none;margin-top:auto;-webkit-overflow-scrolling:touch}
#row::-webkit-scrollbar{display:none}
.tile{flex:none;width:150px;scroll-snap-align:center;position:relative;transition:transform .18s}
.tile:active{transform:scale(1.08)}
.art{width:150px;height:150px;border-radius:22px;display:grid;place-items:center;font-size:62px;box-shadow:0 14px 34px #0009,inset 0 0 0 1px #ffffff30}
.tile b{display:block;margin-top:12px;font-size:15px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;text-align:center;color:var(--dim);font-size:12px;margin-top:2px}
.add .art{background:#ffffff0d;border:2px dashed #ffffff55;font-size:54px;color:#ffffffaa;box-shadow:none}
.del{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:#14141c;border:1px solid var(--line);color:#ff7b8a;font-size:14px;display:grid;place-items:center;z-index:2}
.hint{padding:6px 28px 26px;color:var(--dim);font-size:13px;min-height:36px;margin-bottom:auto}
#play{position:fixed;inset:0;background:#000;display:none;flex-direction:column}
#play.on{display:flex}
#bar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 6px) 14px 8px;background:#0a0f24;border-bottom:1px solid var(--line)}
#back{background:#ffffff18;border:0;color:var(--ink);font-size:16px;font-weight:600;padding:9px 16px;border-radius:20px}
#back:active{background:#ffffff33}
#pt{color:var(--dim);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
iframe{flex:1;width:100%;border:0;background:#000}
html{-webkit-text-size-adjust:100%}
#home{background:#02040d;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;transition:background .7s;pointer-events:none}
#b1{width:70vmax;height:70vmax;left:-25vmax;top:-35vmax;background:var(--c1,#1d3f9a)}
#b2{width:60vmax;height:60vmax;right:-25vmax;bottom:-35vmax;background:var(--c2,#5b1f8f)}
.top{position:relative;z-index:2;padding:22px 36px}
.nav{display:flex;gap:30px;flex:1;font-size:19px}
.nav span{color:var(--dim)}
.nav .cur{color:#fff;font-weight:600;position:relative}
.nav .cur::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:3px;border-radius:2px;background:#fff}
#row{position:relative;z-index:2;gap:34px;padding:46px calc(50vw - 75px) 64px;scroll-snap-type:x mandatory}
.tile{opacity:.5;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s;scroll-snap-align:center;scroll-snap-stop:always}
.tile b,.tile small{opacity:0;transition:opacity .25s}
.tile:active{transform:none}
.tile.sel{opacity:1;transform:scale(1.3)}
.tile.sel b,.tile.sel small{opacity:1}
.tile.sel:active{transform:scale(1.24)}
.art{border-radius:26px;background-clip:padding-box}
.tile.sel .art{box-shadow:0 0 0 3px #fff,0 0 46px var(--c1,#4d7cff),0 18px 40px #000a}
.hint{position:relative;z-index:2;text-align:center;padding:0 28px 26px}
#pt{flex:1;min-width:0}
.pb{background:#ffffff18;border:1px solid transparent;color:var(--ink);font-size:14px;font-weight:600;padding:8px 13px;border-radius:18px;white-space:nowrap}
.pb.act{background:#4d7cff;border-color:#9fb6ff}
.pb:active{filter:brightness(1.3)}
#stage{flex:1;position:relative;overflow:hidden}
#stage iframe{position:absolute;inset:0;height:100%}
#pad{position:absolute;inset:0;pointer-events:none;z-index:3;display:none}
#pad.on{display:block}
#pad.edit{pointer-events:auto;background:#0008;background-image:linear-gradient(#ffffff0c 1px,transparent 1px),linear-gradient(90deg,#ffffff0c 1px,transparent 1px);background-size:40px 40px}
.k{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;display:grid;place-items:center;border-radius:50%;
background:#ffffff26;border:2px solid #ffffff59;color:#fff;font-weight:700;letter-spacing:.5px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px #0006;transition:background .08s,transform .08s}
.k::before{content:attr(data-l);pointer-events:none}
.k,.k *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
#pad,#pad *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.k.wide{border-radius:999px}
.k.m{background:#ff4d6d40;border-color:#ff8fa3aa}
.k.down{background:#ffffffaa;color:#000;transform:translate(-50%,-50%) scale(.92)}
#pad.edit .k{cursor:grab;border-style:dashed;animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{rotate:-2deg}to{rotate:2deg}}
.k .x{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;background:#e5394f;color:#fff;font-size:13px;display:none;place-items:center;border:2px solid #fff}
#pad.edit .k .x{display:grid}
.k.joy{background:radial-gradient(circle,#ffffff14 0 40%,#ffffff22 70%);transition:none}
.k.joy.down{background:radial-gradient(circle,#ffffff22 0 40%,#ffffff33 70%);color:#fff;transform:translate(-50%,-50%)}
.k.joy i{position:absolute;font-style:normal;font-size:12px;font-weight:700;opacity:.55;pointer-events:none}
.k.joy i.on{opacity:1;color:#9fb6ff}
.k.joy .kn{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:#ffffffaa;box-shadow:0 3px 10px #0008;pointer-events:none}
#pad.edit .k.joy .kn{background:#ffffff55}

/* === JOY2: Touch-event joystick stilleri === */
.k.joy2{background:radial-gradient(circle,#ff6b6b14 0 40%,#ff6b6b22 70%);border-color:#ff6b6baa;transition:none}
.k.joy2.down{background:radial-gradient(circle,#ff6b6b33 0 40%,#ff6b6b44 70%);transform:translate(-50%,-50%)}
.k.joy2 .kn2{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:#ff9f9fcc;box-shadow:0 3px 10px #0008;pointer-events:none}
#pad.edit .k.joy2 .kn2{background:#ff6b6b88}
.k.joy2 .joy2-label{position:absolute;font-style:normal;font-size:11px;font-weight:700;opacity:.7;pointer-events:none;color:#ffa0a0}

#tools{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
background:#0a0f24ee;border:1px solid var(--line);padding:8px 10px;border-radius:16px;z-index:4;max-width:calc(100% - 20px)}
#pad.edit #tools{display:flex}
#tools label{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px}
#tools input{width:90px;accent-color:#4d7cff}
#sheet{position:absolute;inset:0;z-index:5;background:#000a;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet>div{background:#0f1530;border:1px solid var(--line);border-radius:20px 20px 0 0;width:min(640px,100%);max-height:75%;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#sheet h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
#grid button{background:#ffffff14;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px 4px;font-size:14px;font-weight:600}
#grid button:active{background:#4d7cff}
</style>
</head>
<body>
<div id="home">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
  <div class="top"><div class="nav"><span class="cur">Oyunlar</span><span>Kitaplık</span></div><span id="clk"></span><button id="fs" title="Tam ekran">⛶</button></div>
  <div id="row"></div>
  <div class="hint" id="hint"></div>
</div>
<div id="play">
  <div id="bar"><button id="back">‹ Ana menü</button><span id="pt"></span><button class="pb" id="padt">🎮 Tuşlar</button><button class="pb" id="pade">✎ Düzenle</button></div>
  <div id="stage">
    <iframe id="fr" allow="fullscreen; gamepad; autoplay"></iframe>
    <div id="pad">
      <div id="tools"><button class="pb" id="kadd">＋ Tuş ekle</button><label>Boyut <input type="range" id="ksz" min="44" max="110"></label><button class="pb" id="krst">Sıfırla</button><button class="pb act" id="kdone">Bitti</button></div>
    </div>
    <div id="sheet"><div><h3>Eklenecek tuşu seç <button class="pb" id="sclose">Kapat</button></h3><div id="grid"></div></div></div>
  </div>
</div>
<input type="file" id="file" accept=".html,.htm,text/html" hidden>

/* ============================================================
   JOY2: Touch-event joystick
   Parmak hareketi yönünde iframe'e doğrudan touch/pointer event atar.
   Oyunun touch koordinatları aldığı pointermove/touchmove olaylarını simüle eder.

function joy2El(it,i){
  const sz=Math.round(pad.size*2),R=sz/2;
  const b=document.createElement('div');
  b.className='k joy2';b._k='JOY2';b.dataset.l='';
  const pos=()=>{
    b.style.left=`clamp(${R}px,${it.x}%,calc(100% - ${R}px))`;
    b.style.top=`clamp(${R}px,${it.y}%,calc(100% - ${R}px))`;
  };
  b.style.width=b.style.height=sz+'px';pos();

  // Merkez etiket
  const lbl=document.createElement('i');lbl.className='joy2-label';
  lbl.textContent='👆';lbl.style.cssText='left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;';
  b.append(lbl);

  // Knob (iç top)
  const kn=document.createElement('span');kn.className='kn2';b.append(kn);

  // Sil butonu (edit modunda)
  const x=document.createElement('span');x.className='x';x.textContent='✕';
  x.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();b._release&&b._release();pad.keys.splice(i,1);save();drawPad()});
  x.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  b.append(x);

  let pid=null;
  let joyActive=false;
  let joyOriginX=0,joyOriginY=0;
  let curDX=0,curDY=0,rafId=null;
  // Son gönderilen frame koordinatı (pointerup burada atılacak)
  let lastFX=0,lastFY=0;

  function rafLoop(){
    if(!joyActive){rafId=null;return;}
    const fr=$('fr');
    const frRect=fr.getBoundingClientRect();
    const maxR=R*0.6;
    const dist=Math.hypot(curDX,curDY);
    if(dist>1){
      const scale=Math.min(frRect.width,frRect.height)*0.40/maxR;
      lastFX=frRect.left+joyOriginX+curDX*scale;
      lastFY=frRect.top+joyOriginY+curDY*scale;
      sendToFrame('pointermove',lastFX,lastFY,true);
    }
    rafId=requestAnimationFrame(rafLoop);
  }

  /* iframe içine touch/pointer event gönder */
  function sendToFrame(type,clientX,clientY,isPrimary){
    const w=$('fr').contentWindow;
    if(!w)return;
    try{
      const fr=$('fr');
      const frRect=fr.getBoundingClientRect();
      // iframe koordinatına çevir
      const fx=clientX-frRect.left;
      const fy=clientY-frRect.top;
      const d=w.document;
      const target=d.elementFromPoint(fx,fy)||d.body||d;
      // PointerEvent
      try{
        target.dispatchEvent(new w.PointerEvent(type,{
          bubbles:true,cancelable:true,composed:true,view:w,
          clientX:fx,clientY:fy,screenX:fx,screenY:fy,
          pointerId:55,pointerType:'touch',isPrimary:isPrimary!==false,
          pressure:type==='pointerup'||type==='pointercancel'?0:0.5
        }));
      }catch(e){}
      // TouchEvent (eski API'ler için)
      try{
        if(w.TouchEvent){
          const touch=new w.Touch({identifier:55,target:target,clientX:fx,clientY:fy,screenX:fx,screenY:fy,pageX:fx,pageY:fy,radiusX:10,radiusY:10,rotationAngle:0,force:type==='touchend'?0:0.5});
          const tList=type==='touchend'?[]:[touch];
          const changedList=[touch];
          target.dispatchEvent(new w.TouchEvent(
            type==='pointerdown'?'touchstart':type==='pointerup'?'touchend':type==='pointermove'?'touchmove':'touchcancel',
            {bubbles:true,cancelable:true,composed:true,view:w,touches:tList,targetTouches:tList,changedTouches:changedList}
          ));
        }
      }catch(e){}
      // MouseEvent de gönder (fallback)
      if(type==='pointerdown'){
        try{target.dispatchEvent(new w.MouseEvent('mousedown',{bubbles:true,cancelable:true,view:w,clientX:fx,clientY:fy,button:0,buttons:1}))}catch(e){}
      }else if(type==='pointerup'){
        try{
          target.dispatchEvent(new w.MouseEvent('mouseup',{bubbles:true,cancelable:true,view:w,clientX:fx,clientY:fy,button:0,buttons:0}));
          target.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true,view:w,clientX:fx,clientY:fy,button:0,buttons:0}));
        }catch(e){}
      }else if(type==='pointermove'){
        try{target.dispatchEvent(new w.MouseEvent('mousemove',{bubbles:true,cancelable:true,view:w,clientX:fx,clientY:fy,button:0,buttons:1}))}catch(e){}
      }
    }catch(e){}
  }

  b._release=()=>{
    if(joyActive){
      joyActive=false;
      if(rafId){cancelAnimationFrame(rafId);rafId=null;}
      // pointerup'ı son hareket pozisyonunda at — oyun merkeze snap etmesin
      sendToFrame('pointerup',lastFX||($('fr').getBoundingClientRect().left+joyOriginX),lastFY||($('fr').getBoundingClientRect().top+joyOriginY),true);
    }
    curDX=0;curDY=0;lastFX=0;lastFY=0;
    pid=null;
    b.classList.remove('down');
    kn.style.transform='';
    lbl.style.opacity='0.7';
  };

  ['touchstart','touchmove','touchend'].forEach(t=>b.addEventListener(t,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));
  b.addEventListener('contextmenu',e=>e.preventDefault());

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(pid!=null)return;
    pid=e.pointerId;

    if(editing){b._drag=true;return;}

    b.classList.add('down');
    lbl.style.opacity='1';

    // iframe'in merkezi koordinatını hesapla (oyunun "dinlediği" nokta burası)
    const fr=$('fr');
    const frRect=fr.getBoundingClientRect();
    joyOriginX=frRect.width/2;
    joyOriginY=frRect.height/2;
    curDX=0;curDY=0;

    // RAF döngüsünü başlat

    if(e.pointerId!==pid)return;

    if(editing&&b._drag){

      it.x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));
      it.y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));

    }

    if(!joyActive)return;

    // Joystick görsel hareketi + vektör güncelle
    const bRect=b.getBoundingClientRect();
    let dx=e.clientX-(bRect.left+R);
    let dy=e.clientY-(bRect.top+R);
    const dist=Math.hypot(dx,dy);
    const maxR=R*0.6;

    kn.style.transform=`translate(${dx}px,${dy}px)`;
    // RAF döngüsü bu değerleri kullanacak

    b._release();
  };

  return b;
}

  ['touchstart','touchmove','touchend'].forEach(t=>b.addEventListener(t,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));
  b.addEventListener('contextmenu',e=>e.preventDefault());b.addEventListener('selectstart',e=>e.preventDefault());
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(pid!=null)return;pid=e.pointerId;try{b.setPointerCapture(e.pointerId)}catch(_){}
    if(editing){b._drag=true;return}b.classList.add('down');move(e)});
  b.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;
    if(editing&&b._drag){const r=padEl.getBoundingClientRect();it.x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));it.y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));pos();return}
    if(!editing)move(e)});
  const up=e=>{if(e.pointerId!==pid)return;if(b._drag){b._drag=false;pid=null;save();return}b._release()};
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,up));
  return b;
}
$('padt').onclick=()=>{releaseAll();pad.on=!pad.on;if(!pad.on)editing=false;save();drawPad()};
$('pade').onclick=()=>{releaseAll();editing=!editing;drawPad()};
$('kdone').onclick=()=>{editing=false;drawPad()};
$('krst').onclick=()=>{if(confirm('Tuşlar varsayılana (Joystick, Space, M1) dönsün mü?')){pad.keys=DEF();pad.size=64;save();drawPad()}};
$('ksz').oninput=e=>{pad.size=+e.target.value;save();drawPad()};
const grid=$('grid');
Object.keys(KEYS).forEach(n=>{const b=document.createElement('button');b.textContent=KEYS[n].lb||n;
  b.onclick=()=>{pad.keys.push({k:n,x:50,y:50});save();$('sheet').classList.remove('on');drawPad()};grid.append(b)});
$('kadd').onclick=()=>$('sheet').classList.add('on');
$('sclose').onclick=()=>$('sheet').classList.remove('on');
$('sheet').onclick=e=>{if(e.target.id==='sheet')e.target.classList.remove('on')};
padEl.addEventListener('touchstart',e=>{if(editing&&e.target===padEl&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('selectstart',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
$('fr').addEventListener('load',()=>{try{$('fr').contentWindow.focus()}catch(e){}});

/* ===== Sağ tık / fare sürükleme ile döndürme =====
   stage alanında sağ tık basılı tutup sürükleme → iframe'e mousemove gönderir
   (FPS/döndürme sistemi kullanan oyunlar için)
*/
(()=>{
  const stage=$('stage');
  let rmDown=false,rmLastX=0,rmLastY=0,rmRafId=null,rmDX=0,rmDY=0;

  function sendMouseToFrame(type,fx,fy,btn,btns){
    const w=$('fr').contentWindow;if(!w)return;
    try{
      const d=w.document;
      const t=d.elementFromPoint(fx,fy)||d.body||d;
      try{t.dispatchEvent(new w.MouseEvent(type,{bubbles:true,cancelable:true,view:w,clientX:fx,clientY:fy,screenX:fx,screenY:fy,button:btn,buttons:btns,movementX:rmDX,movementY:rmDY}))}catch(e){}
      // Pointer event de at
      try{t.dispatchEvent(new w.PointerEvent(type==='mousemove'?'pointermove':type==='mousedown'?'pointerdown':'pointerup',
        {bubbles:true,cancelable:true,view:w,clientX:fx,clientY:fy,pointerId:66,pointerType:'mouse',isPrimary:true,button:btn,buttons:btns,movementX:rmDX,movementY:rmDY}))}catch(e){}
    }catch(e){}
  }

  function rmLoop(){
    if(!rmDown){rmRafId=null;return;}
    if(Math.abs(rmDX)>0.1||Math.abs(rmDY)>0.1){
      const fr=$('fr');
      const frRect=fr.getBoundingClientRect();
      const cx=frRect.width/2,cy=frRect.height/2;
      sendMouseToFrame('mousemove',cx,cy,2,2);
    }
    rmRafId=requestAnimationFrame(rmLoop);
  }

  // Sağ tık basılı tut başlangıcı
  stage.addEventListener('mousedown',e=>{
    if(e.button!==2)return;
    e.preventDefault();
    rmDown=true;rmLastX=e.clientX;rmLastY=e.clientY;rmDX=0;rmDY=0;
    const fr=$('fr');const frRect=fr.getBoundingClientRect();
    const cx=frRect.width/2,cy=frRect.height/2;
    sendMouseToFrame('mousedown',cx,cy,2,2);
    if(rmRafId)cancelAnimationFrame(rmRafId);
    rmRafId=requestAnimationFrame(rmLoop);
  },{passive:false});

  stage.addEventListener('mousemove',e=>{
    if(!rmDown)return;
    rmDX=e.clientX-rmLastX;rmDY=e.clientY-rmLastY;
    rmLastX=e.clientX;rmLastY=e.clientY;
  });

  function rmUp(){
    if(!rmDown)return;
    rmDown=false;rmDX=0;rmDY=0;
    if(rmRafId){cancelAnimationFrame(rmRafId);rmRafId=null;}
    const fr=$('fr');const frRect=fr.getBoundingClientRect();
    const cx=frRect.width/2,cy=frRect.height/2;
    sendMouseToFrame('mouseup',cx,cy,2,0);
  }
  document.addEventListener('mouseup',e=>{if(e.button===2)rmUp()});
  stage.addEventListener('contextmenu',e=>e.preventDefault());

  // Touch ile iki parmak döndürme (sağ joystick gibi)
  // Tek parmak zaten JOY2 ile yönetiliyor; burada stage'e doğrudan inen iki parmaklı hareketi yakala
  let t2={};
  stage.addEventListener('touchstart',e=>{
    [...e.changedTouches].forEach(t=>t2[t.identifier]={x:t.clientX,y:t.clientY});
  },{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(Object.keys(t2).length<2)return; // tek parmak JOY2'ye gitsin
    [...e.changedTouches].forEach(t=>{
      if(!t2[t.identifier])return;
      const dx=t.clientX-t2[t.identifier].x;
      const dy=t.clientY-t2[t.identifier].y;
      t2[t.identifier]={x:t.clientX,y:t.clientY};
      rmDX=dx;rmDY=dy;
      const fr=$('fr');const frRect=fr.getBoundingClientRect();
      const w=$('fr').contentWindow;if(!w)return;
      try{
        const d=w.document,fx=frRect.width/2,fy=frRect.height/2;
        const tgt=d.elementFromPoint(fx,fy)||d.body||d;
        try{tgt.dispatchEvent(new w.MouseEvent('mousemove',{bubbles:true,cancelable:true,view:w,clientX:fx,clientY:fy,movementX:dx,movementY:dy,buttons:2}))}catch(e){}
      }catch(e){}
    });
  },{passive:true});
  stage.addEventListener('touchend',e=>{[...e.changedTouches].forEach(t=>delete t2[t.identifier])},{passive:true});
})();

drawPad();
render();
</script>
</body>
</html>
